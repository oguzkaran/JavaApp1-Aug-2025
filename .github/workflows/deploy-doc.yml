name: Deploy Documents to Github pagesHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/Libraries/DataSourceLib/doc/**doc/**"
      - ".github/workflows/deploy-doc.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository files
        uses: actions/checkout@v4

      - name: Configure Github pages
        uses: actions/configure-pages@v5

      - name: Load documentation directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: src/Libraries/DataSourceLib/doc/

      - name: Deploy in Github pages
        id: deployment
        uses: actions/deploy-pages@v4
